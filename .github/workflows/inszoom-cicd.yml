name: INSZoom CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637442130394:role/INSZoom-GitHubActions-Role
          aws-region: us-east-1

      - name: Deploy through SSM
        run: |
          set -e

          echo "================================="
          echo "Starting INSZoom deployment"
          echo "================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-02b7b8b1b4991922a" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ubuntu git -C /home/ubuntu/INSZoom pull origin main",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom/BAIS/Frontend && npm ci && npm run build'\''",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom/INSZoom/frontend && npm ci && npm run build'\''",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom/Backend && npm ci && pm2 restart inszoom-backend --update-env'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02b7b8b1b4991922a"

          echo "===== SSM COMMAND RESULT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02b7b8b1b4991922a" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
