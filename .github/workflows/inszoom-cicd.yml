name: INSZoom CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy INSZoom
        run: |
          set -e

          echo "================================="
          echo "Starting INSZoom deployment"
          echo "================================="

          cd /home/ubuntu/INSZoom

          echo "================================="
          echo "Updating INSZoom source code"
          echo "================================="

          git fetch origin
          git checkout main
          git reset --hard origin/main

          echo "================================="
          echo "Building Client Frontend"
          echo "================================="

          cd /home/ubuntu/INSZoom/BAIS/Frontend
          npm ci
          npm run build

          echo "================================="
          echo "Building Admin Frontend"
          echo "================================="

          cd /home/ubuntu/INSZoom/INSZoom/frontend
          npm ci
          npm run build

          echo "================================="
          echo "Deploying Backend"
          echo "================================="

          cd /home/ubuntu/INSZoom/Backend
          npm ci
          pm2 restart inszoom-backend

          echo "================================="
          echo "Deployment completed"
          echo "================================="
