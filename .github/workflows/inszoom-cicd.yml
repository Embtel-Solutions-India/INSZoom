name: INSZoom CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637442130394:role/INSZoom-GitHubActions-Role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Deploy through SSM
        shell: bash
        run: |
          set -e

          INSTANCE_ID="i-02b7b8b1b4991922a"

          echo "================================="
          echo "Starting INSZoom deployment"
          echo "================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom && git fetch origin && git reset --hard origin/main'\''",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom/BAIS/Frontend && npm ci --include=optional && npm run build'\''",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom/INSZoom/frontend && npm ci && npm run build'\''",
              "sudo -u ubuntu bash -c '\''cd /home/ubuntu/INSZoom/Backend && npm ci && pm2 restart inszoom-backend --update-env'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM deployment..."

          while true; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Current SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "================================="
                echo "INSZoom deployment successful"
                echo "================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "================================="
                echo "INSZoom deployment FAILED"
                echo "================================="

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;

              Pending|InProgress|Delayed)
                sleep 15
                ;;

              *)
                echo "Unknown SSM status: $STATUS"
                sleep 15
                ;;
            esac

          done
