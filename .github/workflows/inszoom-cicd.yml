name: INSZoom CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Build and verify frontends
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VITE_API_URL: ${{ vars.IMMIGLANCE_VITE_API_URL }}
      VITE_API_TIMEOUT_MS: ${{ vars.IMMIGLANCE_VITE_API_TIMEOUT_MS }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VITE_API_URL
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "ERROR: IMMIGLANCE_VITE_API_URL is empty."
            exit 1
          fi
          echo "VITE_API_URL is available."
          echo "API host: $(echo "$VITE_API_URL" | sed -E 's#https?://([^/]+).*#\1#')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Immiglance/Landing/package-lock.json
            Immiglance/Client/package-lock.json
            Attorney/package-lock.json
            Admin/frontend/package-lock.json
            Backend/package-lock.json

      # Landing
      - name: Install Landing dependencies
        working-directory: Immiglance/Landing
        run: npm ci --include=optional

      - name: Build Landing
        working-directory: Immiglance/Landing
        env:
          VITE_API_URL: ${{ vars.IMMIGLANCE_VITE_API_URL }}
          VITE_API_TIMEOUT_MS: ${{ vars.IMMIGLANCE_VITE_API_TIMEOUT_MS }}
          VITE_ADMIN_URL: ${{ vars.IMMIGLANCE_VITE_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ vars.IMMIGLANCE_VITE_ATTORNEY_PORTAL_URL }}
          VITE_CLIENT_URL: ${{ vars.IMMIGLANCE_VITE_CLIENT_URL }}
        run: npm run build

      - name: Package Landing
        run: tar -czf /tmp/landing-frontend.tar.gz -C Immiglance/Landing/dist .

      # ── Immiglance Client ──────────────────────────────────────────────
      - name: Install Client dependencies
        working-directory: Immiglance/Client
        run: npm ci --include=optional

      - name: Build Client
        working-directory: Immiglance/Client
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.BAIS_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_ADMIN_URL: ${{ env.PROD_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ env.PROD_ATTORNEY_URL }}
          VITE_LANDING_URL: ${{ env.PROD_LANDING_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.BAIS_VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.BAIS_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.BAIS_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.BAIS_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.BAIS_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.BAIS_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.BAIS_VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Package Client
        run: tar -czf /tmp/client-frontend.tar.gz -C Immiglance/Client/dist .

      # ── Admin ────────────────────────────────────────────────────────
      - name: Install Admin Frontend dependencies
        working-directory: Admin/frontend
        run: npm ci --include=optional

      - name: Build Admin
        working-directory: Admin/frontend
        env:
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_ADMIN_URL: ${{ env.PROD_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ env.PROD_ATTORNEY_URL }}
          VITE_CLIENT_URL: ${{ env.PROD_CLIENT_URL }}
        run: npm run build

      - name: Package Admin
        run: |
          tar -czf /tmp/admin-frontend.tar.gz \
            -C Admin/frontend/dist .

      # =====================================================
      # CLIENT
      # =====================================================

      - name: Verify Landing build
        working-directory: Immiglance/Landing
        run: |
          if grep -R "MISSING-VITE_API_URL.invalid" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Landing build contains MISSING-VITE_API_URL.invalid"
            exit 1
          fi
          if ! grep -R "client.immiglance.com/api" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Landing build does not contain the expected API URL"
            exit 1
          fi
          echo "Landing API URL verified successfully."

      # Client
      - name: Install Client dependencies
        working-directory: Immiglance/Client
        run: npm ci --include=optional

      - name: Build Client
        working-directory: Immiglance/Client
        env:
          VITE_API_URL: ${{ vars.IMMIGLANCE_VITE_API_URL }}
          VITE_API_TIMEOUT_MS: ${{ vars.IMMIGLANCE_VITE_API_TIMEOUT_MS }}
          VITE_ADMIN_URL: ${{ vars.IMMIGLANCE_VITE_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ vars.IMMIGLANCE_VITE_ATTORNEY_PORTAL_URL }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}
        run: npm run build

      - name: Verify Client build
        working-directory: Immiglance/Client
        run: |
          if grep -R "MISSING-VITE_API_URL.invalid" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Client build contains MISSING-VITE_API_URL.invalid"
            exit 1
          fi
          if ! grep -R "client.immiglance.com/api" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Client build does not contain the expected API URL"
            exit 1
          fi
          echo "Client API URL verified successfully."

      # Attorney
      - name: Install Attorney dependencies
        working-directory: Attorney
        run: npm ci --include=optional

      - name: Build Attorney
        working-directory: Attorney
        env:
          VITE_API_URL: ${{ vars.IMMIGLANCE_VITE_API_URL }}
          VITE_API_TIMEOUT_MS: ${{ vars.IMMIGLANCE_VITE_API_TIMEOUT_MS }}
        run: npm run build

      - name: Verify Attorney build
        working-directory: Attorney
        run: |
          if grep -R "MISSING-VITE_API_URL.invalid" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Attorney build contains MISSING-VITE_API_URL.invalid"
            exit 1
          fi
          if ! grep -R "client.immiglance.com/api" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Attorney build does not contain the expected API URL"
            exit 1
          fi
          echo "Attorney API URL verified successfully."

      # Admin
      - name: Install Admin dependencies
        working-directory: Admin/frontend
        run: npm ci --include=optional

      - name: Build Admin
        working-directory: Admin/frontend
        env:
          VITE_API_URL: ${{ vars.IMMIGLANCE_VITE_API_URL }}
          VITE_API_TIMEOUT_MS: ${{ vars.IMMIGLANCE_VITE_API_TIMEOUT_MS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Verify Admin build
        working-directory: Admin/frontend
        run: |
          if grep -R "MISSING-VITE_API_URL.invalid" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Admin build contains MISSING-VITE_API_URL.invalid"
            exit 1
          fi
          if ! grep -R "client.immiglance.com/api" dist/assets >/dev/null 2>&1; then
            echo "ERROR: Admin build does not contain the expected API URL"
            exit 1
          fi
          echo "Admin API URL verified successfully."

      # Package all frontend builds for passing to the deploy job.
      - name: Package frontend builds
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf artifacts/landing-frontend.tar.gz -C Immiglance/Landing/dist .
          tar -czf artifacts/client-frontend.tar.gz -C Immiglance/Client/dist .
          tar -czf artifacts/attorney-frontend.tar.gz -C Attorney/dist .
          tar -czf artifacts/admin-frontend.tar.gz -C Admin/frontend/dist .
          ls -lh artifacts/

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inszoom-frontends
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: us-east-1
      EC2_INSTANCE_ID: i-02b7b8b1b4991922a
      S3_BUCKET: inszoom-bucket
      DEPLOY_DIR: /home/ubuntu/INSZoom/deploy-temp

    steps:
      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: inszoom-frontends
          path: artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637442130394:role/INSZoom-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload frontend artifacts to S3
        run: |
          set -euo pipefail
          aws s3 cp artifacts/landing-frontend.tar.gz \
            "s3://${S3_BUCKET}/inszoom-deploy/landing-frontend.tar.gz" \
            --region "$AWS_REGION"
          aws s3 cp artifacts/client-frontend.tar.gz \
            "s3://${S3_BUCKET}/inszoom-deploy/client-frontend.tar.gz" \
            --region "$AWS_REGION"
          aws s3 cp artifacts/attorney-frontend.tar.gz \
            "s3://${S3_BUCKET}/inszoom-deploy/attorney-frontend.tar.gz" \
            --region "$AWS_REGION"
          aws s3 cp artifacts/admin-frontend.tar.gz \
            "s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz" \
            --region "$AWS_REGION"

      - name: Generate presigned URLs
        run: |
          set -euo pipefail
          echo "LANDING_URL=$(aws s3 presign "s3://${S3_BUCKET}/inszoom-deploy/landing-frontend.tar.gz" --expires-in 1800 --region "$AWS_REGION")" >> "$GITHUB_ENV"
          echo "CLIENT_URL=$(aws s3 presign "s3://${S3_BUCKET}/inszoom-deploy/client-frontend.tar.gz" --expires-in 1800 --region "$AWS_REGION")" >> "$GITHUB_ENV"
          echo "ATTORNEY_URL=$(aws s3 presign "s3://${S3_BUCKET}/inszoom-deploy/attorney-frontend.tar.gz" --expires-in 1800 --region "$AWS_REGION")" >> "$GITHUB_ENV"
          echo "ADMIN_URL=$(aws s3 presign "s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz" --expires-in 1800 --region "$AWS_REGION")" >> "$GITHUB_ENV"

      - name: Prepare SSM deployment parameters
        env:
          LANDING_URL: ${{ env.LANDING_URL }}
          CLIENT_URL: ${{ env.CLIENT_URL }}
          ATTORNEY_URL: ${{ env.ATTORNEY_URL }}
          ADMIN_URL: ${{ env.ADMIN_URL }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = "/home/ubuntu/INSZoom"
          deploy_dir = os.environ["DEPLOY_DIR"]

          commands = [
              "set -e",
              f"sudo -u ubuntu git -C {root} fetch origin main",
              f"sudo -u ubuntu git -C {root} checkout main",
              f"sudo -u ubuntu git -C {root} pull --ff-only origin main",
              f"sudo mkdir -p {deploy_dir}",
              f"sudo curl -fLsS {json.dumps(os.environ['LANDING_URL'])} -o {deploy_dir}/landing-frontend.tar.gz",
              f"sudo curl -fLsS {json.dumps(os.environ['CLIENT_URL'])} -o {deploy_dir}/client-frontend.tar.gz",
              f"sudo curl -fLsS {json.dumps(os.environ['ATTORNEY_URL'])} -o {deploy_dir}/attorney-frontend.tar.gz",
              f"sudo curl -fLsS {json.dumps(os.environ['ADMIN_URL'])} -o {deploy_dir}/admin-frontend.tar.gz",
          ]

          frontends = [
              ("landing", f"{root}/Immiglance/Landing/dist"),
              ("client", f"{root}/Immiglance/Client/dist"),
              ("attorney", f"{root}/Attorney/dist"),
              ("admin", f"{root}/Admin/frontend/dist"),
          ]

          for name, destination in frontends:
              archive = f"{deploy_dir}/{name}-frontend.tar.gz"
              commands.extend([
                  f"sudo rm -rf {destination}",
                  f"sudo mkdir -p {destination}",
                  f"sudo tar -xzf {archive} -C {destination}",
                  f"sudo chown -R ubuntu:ubuntu {destination}",
              ])

          commands.extend([
              f"cd {root}/Backend && sudo -u ubuntu npm ci --omit=dev",
              "sudo -u ubuntu env PM2_HOME=/home/ubuntu/.pm2 pm2 restart inszoom-backend --update-env",
              f"sudo rm -rf {deploy_dir}",
              "echo Deployment completed successfully.",
          ])

          Path("ssm-deploy-parameters.json").write_text(
              json.dumps({"commands": commands})
          )
          PY

      - name: Send deployment command to EC2
        id: deploy_ssm
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "INSZoom CI/CD deployment" \
            --parameters file://ssm-deploy-parameters.json \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.deploy_ssm.outputs.command_id }}
        run: |
          set -euo pipefail
          for i in {1..90}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text || true
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
