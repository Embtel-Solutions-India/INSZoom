name: INSZoom CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# Public app URLs (not secrets — every app's own gitignored local
# .env.production already agrees on these same values; see Attorney/.env.
# production's comment: the shared Backend is served under
# client.immiglance.com/api, not a separate api.immiglance.com host).
# Centralized here so every build step below uses the exact same values —
# a per-app typo here was the root cause of production's missing
# VITE_ADMIN_URL/VITE_ATTORNEY_PORTAL_URL console warnings (this workflow
# previously only ever built the pre-split, now-deleted Immiglance/Frontend
# app, and never set these vars at all).
env:
  PROD_API_URL: https://client.immiglance.com/api
  PROD_LANDING_URL: https://immiglance.com
  PROD_CLIENT_URL: https://client.immiglance.com
  PROD_ADMIN_URL: https://admin.immiglance.com
  PROD_ATTORNEY_URL: https://attorney.immiglance.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EC2_INSTANCE_ID: i-02b7b8b1b4991922a
      S3_BUCKET: inszoom-bucket
      DEPLOY_DIR: /home/ubuntu/INSZoom/deploy-temp

      # =====================================================
      # COMMON IMMIGLANCE FRONTEND CONFIG
      # =====================================================

      VITE_API_URL: ${{ secrets.IMMIGLANCE_VITE_API_URL }}
      VITE_API_TIMEOUT_MS: ${{ secrets.IMMIGLANCE_VITE_API_TIMEOUT_MS }}

      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE.JS
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Immiglance/Landing/package-lock.json
            Immiglance/Client/package-lock.json
            Attorney/package-lock.json
            Admin/frontend/package-lock.json
            Attorney/package-lock.json
            Backend/package-lock.json

      # ── Immiglance Landing ────────────────────────────────────────────
      # =====================================================
      # LANDING
      # =====================================================

      - name: Install Landing dependencies
        working-directory: Immiglance/Landing
        run: npm ci --include=optional

      - name: Build Landing
        working-directory: Immiglance/Landing
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.BAIS_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_ADMIN_URL: ${{ env.PROD_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ env.PROD_ATTORNEY_URL }}
          VITE_CLIENT_URL: ${{ env.PROD_CLIENT_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.BAIS_VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.BAIS_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.BAIS_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.BAIS_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.BAIS_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.BAIS_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.BAIS_VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Package Landing
        run: tar -czf /tmp/landing-frontend.tar.gz -C Immiglance/Landing/dist .

      # ── Immiglance Client ──────────────────────────────────────────────
      - name: Install Client dependencies
        working-directory: Immiglance/Client
        run: npm ci --include=optional

      - name: Build Client
        working-directory: Immiglance/Client
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.BAIS_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_ADMIN_URL: ${{ env.PROD_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ env.PROD_ATTORNEY_URL }}
          VITE_LANDING_URL: ${{ env.PROD_LANDING_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.BAIS_VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.BAIS_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.BAIS_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.BAIS_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.BAIS_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.BAIS_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.BAIS_VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Package Client
        run: tar -czf /tmp/client-frontend.tar.gz -C Immiglance/Client/dist .

      # ── Admin ────────────────────────────────────────────────────────
      - name: Install Admin Frontend dependencies
          VITE_ADMIN_URL: ${{ secrets.IMMIGLANCE_VITE_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ secrets.IMMIGLANCE_VITE_ATTORNEY_PORTAL_URL }}
          VITE_CLIENT_URL: ${{ secrets.IMMIGLANCE_VITE_CLIENT_URL }}
        run: npm run build

      - name: Package Landing
        run: |
          tar -czf /tmp/landing-frontend.tar.gz \
            -C Immiglance/Landing/dist .

      # =====================================================
      # CLIENT
      # =====================================================

      - name: Install Client dependencies
        working-directory: Immiglance/Client
        run: npm ci --include=optional

      - name: Build Client
        working-directory: Immiglance/Client
        env:
          VITE_ADMIN_URL: ${{ secrets.IMMIGLANCE_VITE_ADMIN_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ secrets.IMMIGLANCE_VITE_ATTORNEY_PORTAL_URL }}
          VITE_LANDING_URL: ${{ secrets.VITE_LANDING_URL }}
        run: npm run build

      - name: Package Client
        run: |
          tar -czf /tmp/client-frontend.tar.gz \
            -C Immiglance/Client/dist .

      # =====================================================
      # ATTORNEY
      # =====================================================

      - name: Install Attorney dependencies
        working-directory: Attorney
        run: npm ci --include=optional

      - name: Build Attorney
        working-directory: Attorney
        run: npm run build

      - name: Package Attorney
        run: |
          tar -czf /tmp/attorney-frontend.tar.gz \
            -C Attorney/dist .

      # =====================================================
      # ADMIN
      # =====================================================

      - name: Install Admin dependencies
        working-directory: Admin/frontend
        run: npm ci --include=optional

      - name: Build Admin
        working-directory: Admin/frontend
        env:
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.BAIS_VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.BAIS_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.BAIS_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.BAIS_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.BAIS_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.BAIS_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.BAIS_VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Package Admin Frontend
        run: tar -czf /tmp/admin-frontend.tar.gz -C Admin/frontend/dist .

      # ── Attorney ─────────────────────────────────────────────────────
      - name: Install Attorney dependencies
        working-directory: Attorney
        run: npm ci --include=optional

      - name: Build Attorney
        working-directory: Attorney
        env:
          VITE_API_URL: ${{ env.PROD_API_URL }}
          VITE_ATTORNEY_PORTAL_URL: ${{ env.PROD_ATTORNEY_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.BAIS_VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.BAIS_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.BAIS_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.BAIS_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.BAIS_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.BAIS_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.BAIS_VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Package Attorney
        run: tar -czf /tmp/attorney-frontend.tar.gz -C Attorney/dist .
      - name: Package Admin
        run: |
         tar -czf /tmp/admin-frontend.tar.gz \
           -C Admin/frontend/dist .

      # =====================================================
      # AWS OIDC
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637442130394:role/INSZoom-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload frontend artifacts
      # =====================================================
      # UPLOAD ARTIFACTS TO S3
      # =====================================================

      - name: Upload Landing artifact
        run: |
          aws s3 cp \
            /tmp/landing-frontend.tar.gz \
            s3://${S3_BUCKET}/inszoom-deploy/landing-frontend.tar.gz

      - name: Upload Client artifact
        run: |
          aws s3 cp \
            /tmp/client-frontend.tar.gz \
            s3://${S3_BUCKET}/inszoom-deploy/client-frontend.tar.gz

      - name: Upload Attorney artifact
        run: |
          aws s3 cp \
            /tmp/attorney-frontend.tar.gz \
            s3://${S3_BUCKET}/inszoom-deploy/attorney-frontend.tar.gz

      - name: Upload Admin artifact
        run: |
          aws s3 cp /tmp/landing-frontend.tar.gz s3://${S3_BUCKET}/inszoom-deploy/landing-frontend.tar.gz
          aws s3 cp /tmp/client-frontend.tar.gz s3://${S3_BUCKET}/inszoom-deploy/client-frontend.tar.gz
          aws s3 cp /tmp/admin-frontend.tar.gz s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz
          aws s3 cp /tmp/attorney-frontend.tar.gz s3://${S3_BUCKET}/inszoom-deploy/attorney-frontend.tar.gz

      # =====================================================
      # GENERATE PRESIGNED URLS
      # =====================================================

      - name: Generate presigned URLs
        run: |
          LANDING_URL=$(aws s3 presign s3://${S3_BUCKET}/inszoom-deploy/landing-frontend.tar.gz --expires-in 1800 --region ${AWS_REGION})
          CLIENT_URL=$(aws s3 presign s3://${S3_BUCKET}/inszoom-deploy/client-frontend.tar.gz --expires-in 1800 --region ${AWS_REGION})
          ADMIN_URL=$(aws s3 presign s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz --expires-in 1800 --region ${AWS_REGION})
          ATTORNEY_URL=$(aws s3 presign s3://${S3_BUCKET}/inszoom-deploy/attorney-frontend.tar.gz --expires-in 1800 --region ${AWS_REGION})

          echo "LANDING_URL=$LANDING_URL" >> "$GITHUB_ENV"
          echo "CLIENT_URL=$CLIENT_URL" >> "$GITHUB_ENV"
          LANDING_URL=$(aws s3 presign \
            s3://${S3_BUCKET}/inszoom-deploy/landing-frontend.tar.gz \
            --expires-in 1800 \
            --region ${AWS_REGION})

          CLIENT_URL=$(aws s3 presign \
            s3://${S3_BUCKET}/inszoom-deploy/client-frontend.tar.gz \
            --expires-in 1800 \
            --region ${AWS_REGION})

          ATTORNEY_URL=$(aws s3 presign \
            s3://${S3_BUCKET}/inszoom-deploy/attorney-frontend.tar.gz \
            --expires-in 1800 \
            --region ${AWS_REGION})

          ADMIN_URL=$(aws s3 presign \
            s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz \
            --expires-in 1800 \
            --region ${AWS_REGION})

          echo "LANDING_URL=$LANDING_URL" >> "$GITHUB_ENV"
          echo "CLIENT_URL=$CLIENT_URL" >> "$GITHUB_ENV"
          echo "ATTORNEY_URL=$ATTORNEY_URL" >> "$GITHUB_ENV"
          echo "ADMIN_URL=$ADMIN_URL" >> "$GITHUB_ENV"
          echo "ATTORNEY_URL=$ATTORNEY_URL" >> "$GITHUB_ENV"

      # =====================================================
      # DEPLOY TO EC2
      # =====================================================

      - name: Deploy application to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "INSZoom CI/CD deployment" \
            --parameters commands="[
              \"set -e\",
              \"rm -rf ${DEPLOY_DIR}\",
              \"mkdir -p ${DEPLOY_DIR}\",

              \"echo 'Updating repository...'\",
              \"sudo -u ubuntu git -C /home/ubuntu/INSZoom fetch origin main\",
              \"sudo -u ubuntu git -C /home/ubuntu/INSZoom checkout main\",
              \"sudo -u ubuntu git -C /home/ubuntu/INSZoom pull --ff-only origin main\",

              \"echo 'Downloading Landing frontend...'\",
              \"curl -fL '${LANDING_URL}' -o ${DEPLOY_DIR}/landing-frontend.tar.gz\",

              \"echo 'Downloading Client frontend...'\",
              \"curl -fL '${CLIENT_URL}' -o ${DEPLOY_DIR}/client-frontend.tar.gz\",

              \"echo 'Downloading Attorney frontend...'\",
              \"curl -fL '${ATTORNEY_URL}' -o ${DEPLOY_DIR}/attorney-frontend.tar.gz\",

              \"echo 'Downloading Admin frontend...'\",
              \"curl -fL '${ADMIN_URL}' -o ${DEPLOY_DIR}/admin-frontend.tar.gz\",

              \"echo 'Downloading Attorney frontend...'\",
              \"curl -fL '${ATTORNEY_URL}' -o ${DEPLOY_DIR}/attorney-frontend.tar.gz\",
              \"echo 'Deploying Landing frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Immiglance/Landing/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Immiglance/Landing/dist\",
              \"tar -xzf ${DEPLOY_DIR}/landing-frontend.tar.gz -C /home/ubuntu/INSZoom/Immiglance/Landing/dist\",

              \"echo 'Deploying Client frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Immiglance/Client/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Immiglance/Client/dist\",
              \"tar -xzf ${DEPLOY_DIR}/client-frontend.tar.gz -C /home/ubuntu/INSZoom/Immiglance/Client/dist\",

              \"echo 'Deploying Attorney frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Attorney/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Attorney/dist\",
              \"tar -xzf ${DEPLOY_DIR}/attorney-frontend.tar.gz -C /home/ubuntu/INSZoom/Attorney/dist\",

              \"echo 'Deploying Landing frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Immiglance/Landing/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Immiglance/Landing/dist\",
              \"tar -xzf ${DEPLOY_DIR}/landing-frontend.tar.gz -C /home/ubuntu/INSZoom/Immiglance/Landing/dist\",

              \"echo 'Deploying Client frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Immiglance/Client/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Immiglance/Client/dist\",
              \"tar -xzf ${DEPLOY_DIR}/client-frontend.tar.gz -C /home/ubuntu/INSZoom/Immiglance/Client/dist\",

              \"echo 'Deploying Admin frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Admin/frontend/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Admin/frontend/dist\",
              \"tar -xzf ${DEPLOY_DIR}/admin-frontend.tar.gz -C /home/ubuntu/INSZoom/Admin/frontend/dist\",

              \"echo 'Deploying Attorney frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Attorney/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Attorney/dist\",
              \"tar -xzf ${DEPLOY_DIR}/attorney-frontend.tar.gz -C /home/ubuntu/INSZoom/Attorney/dist\",

              \"echo 'Installing backend production dependencies...'\",
              \"cd /home/ubuntu/INSZoom/Backend && npm ci --omit=dev\",

              \"echo 'Restarting backend...'\",
              \"sudo -u ubuntu env PM2_HOME=/home/ubuntu/.pm2 pm2 restart inszoom-backend --update-env\",

              \"echo 'Cleaning deployment files...'\",
              \"rm -rf ${DEPLOY_DIR}\",

              \"echo 'Deployment completed successfully.'\"
            ]" \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # =====================================================
      # WAIT FOR DEPLOYMENT
      # =====================================================

      - name: Wait for deployment
        run: |
          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."

              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelling" ]; then

              echo "Deployment failed with status: $STATUS"

              echo "----- STDOUT -----"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardOutputContent" \
                --output text

              echo "----- STDERR -----"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 15
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
