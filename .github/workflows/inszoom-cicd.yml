name: INSZoom CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EC2_INSTANCE_ID: i-02b7b8b1b4991922a
      S3_BUCKET: inszoom-bucket
      DEPLOY_DIR: /home/ubuntu/INSZoom/deploy-temp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Immiglance/Frontend/package-lock.json
            Admin/frontend/package-lock.json
            Backend/package-lock.json

      - name: Install Immiglance Frontend dependencies
        working-directory: Immiglance/Frontend
        run: npm ci --include=optional

      - name: Build Immiglance Frontend
        working-directory: Immiglance/Frontend
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.BAIS_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.BAIS_VITE_API_URL }}
          VITE_INSZOOM_URL: ${{ secrets.BAIS_VITE_INSZOOM_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.BAIS_VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.BAIS_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.BAIS_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.BAIS_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.BAIS_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.BAIS_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.BAIS_VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Package Immiglance Frontend
        run: |
          tar -czf /tmp/immiglance-frontend.tar.gz \
            -C Immiglance/Frontend/dist .

      - name: Install Admin Frontend dependencies
        working-directory: Admin/frontend
        run: npm ci --include=optional

      - name: Build Admin Frontend
        working-directory: Admin/frontend
        run: npm run build

      - name: Package Admin Frontend
        run: |
          tar -czf /tmp/admin-frontend.tar.gz \
            -C Admin/frontend/dist .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637442130394:role/INSZoom-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload Immiglance Frontend artifact
        run: |
          aws s3 cp \
            /tmp/immiglance-frontend.tar.gz \
            s3://${S3_BUCKET}/inszoom-deploy/immiglance-frontend.tar.gz

      - name: Upload Admin Frontend artifact
        run: |
          aws s3 cp \
            /tmp/admin-frontend.tar.gz \
            s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz

      - name: Generate presigned URLs
        run: |
          IMMIGLANCE_URL=$(aws s3 presign \
            s3://${S3_BUCKET}/inszoom-deploy/immiglance-frontend.tar.gz \
            --expires-in 1800 \
            --region ${AWS_REGION})

          ADMIN_URL=$(aws s3 presign \
            s3://${S3_BUCKET}/inszoom-deploy/admin-frontend.tar.gz \
            --expires-in 1800 \
            --region ${AWS_REGION})

          echo "IMMIGLANCE_URL=$IMMIGLANCE_URL" >> "$GITHUB_ENV"
          echo "ADMIN_URL=$ADMIN_URL" >> "$GITHUB_ENV"

      - name: Deploy application to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "INSZoom CI/CD deployment" \
            --parameters commands="[
              \"set -e\",
              \"rm -rf ${DEPLOY_DIR}\",
              \"mkdir -p ${DEPLOY_DIR}\",

              \"echo 'Downloading Immiglance frontend...'\",
              \"curl -fL '${IMMIGLANCE_URL}' -o ${DEPLOY_DIR}/immiglance-frontend.tar.gz\",

              \"echo 'Downloading Admin frontend...'\",
              \"curl -fL '${ADMIN_URL}' -o ${DEPLOY_DIR}/admin-frontend.tar.gz\",

              \"echo 'Deploying Immiglance frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Immiglance/Frontend/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Immiglance/Frontend/dist\",
              \"tar -xzf ${DEPLOY_DIR}/immiglance-frontend.tar.gz -C /home/ubuntu/INSZoom/Immiglance/Frontend/dist\",

              \"echo 'Updating backend source...'\",
              \"sudo -u ubuntu git -C /home/ubuntu/INSZoom fetch origin main\",
              \"sudo -u ubuntu git -C /home/ubuntu/INSZoom checkout main\",
              \"sudo -u ubuntu git -C /home/ubuntu/INSZoom pull --ff-only origin main\",

              \"echo 'Deploying Admin frontend...'\",
              \"rm -rf /home/ubuntu/INSZoom/Admin/frontend/dist\",
              \"mkdir -p /home/ubuntu/INSZoom/Admin/frontend/dist\",
              \"tar -xzf ${DEPLOY_DIR}/admin-frontend.tar.gz -C /home/ubuntu/INSZoom/Admin/frontend/dist\",

              \"echo 'Installing backend production dependencies...'\",
              \"cd /home/ubuntu/INSZoom/Backend && npm ci --omit=dev\",

              \"echo 'Restarting backend...'\",
              \"sudo -u ubuntu env PM2_HOME=/home/ubuntu/.pm2 pm2 restart inszoom-backend --update-env\",

              \"echo 'Cleaning deployment files...'\",
              \"rm -rf ${DEPLOY_DIR}\",

              \"echo 'Deployment completed successfully.'\"
            ]" \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."

              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelling" ]; then

              echo "Deployment failed with status: $STATUS"

              echo "----- STDOUT -----"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardOutputContent" \
                --output text

              echo "----- STDERR -----"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 15
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
